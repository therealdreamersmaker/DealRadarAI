services:
  - type: web
    name: dealradar-ai
    runtime: node
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node src/index.js
    healthCheckPath: /api/autopilot/state
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
